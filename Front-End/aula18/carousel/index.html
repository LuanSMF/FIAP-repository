<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: black;
            margin: 0;
            padding: 0;
        }
        .scene{
            margin: 80px auto;
            width: 210px;
            aspect-ratio: 4/5;
            position: relative;
            perspective: 1000px;
        }
        .carousel{
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 30s infinite linear;
        }
        .carousel img{
            position: absolute;
            left: 0;
            top: 0;
            width: 190px;
            border-radius: 10px;
            aspect-ratio: 4/5;
            transform: rotateY(var(--i)) translateZ(288px);
        }
        @keyframes rotate {
            0%{transform:rotateY(360deg);}
            100%{transform:rotateY(0deg);}
        }
    </style>
    <div class="scene">
       <div class="carousel">
        <img src="1.png" style="--i:000deg">
        <img src="2.png" style="--i:040deg">
        <img src="3.png" style="--i:080deg">
        <img src="4.png" style="--i:120deg">
        <img src="5.png" style="--i:160deg">
        <img src="6.png" style="--i:200deg">
        <img src="7.png" style="--i:240deg">
        <img src="8.png" style="--i:280deg">
        <img src="9.png" style="--i:320deg">
       </div> 
    </div>
</body>
</html>
